# Internal fork helper: builds the production image exactly as Coolify does
# (dockerfile buildpack, target runtime) so build failures are diagnosable in
# CI logs. Coolify's API does not expose build logs; this workflow is the
# fork's visibility into them. Manual trigger only.
name: fork-build-check

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: false
          tags: diamfarm:build-check
